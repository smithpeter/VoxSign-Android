name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Gradle assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: assembleDebug
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voxsign-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: lintDebug
        run: ./gradlew lintDebug --stacktrace

  security-scan:
    name: Sensitive-info scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets and personal identifiers
        run: |
          set -e
          # Scan tracked source files, but exclude .github/ (workflows legitimately contain
          # auth-header-looking patterns) and the LICENSE text (SPDX header).
          FILES=$(git ls-files | grep -E '\.(kt|kts|xml|properties|md|yml|yaml|sh)$' | grep -v '^\.github/' | grep -v '^LICENSE$' || true)
          if [ -z "$FILES" ]; then echo "No files to scan"; exit 0; fi
          grep -rnE 'sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' $FILES && { echo "SECRET_FOUND"; exit 1; } || echo "OK: no secrets"
          grep -rnE 'peterzou|zouyongming|PeterZou' $FILES && { echo "PERSONAL_IDENTIFIER_FOUND"; exit 1; } || echo "OK: no personal identifiers"

  dco-check:
    name: DCO check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on commits
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/main...HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          for c in $(git rev-list "$RANGE"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly=true)' "$c" | grep -q .; then
              echo "Missing Signed-off-by on commit $c"; exit 1
            fi
          done
          echo "OK: all commits signed"
